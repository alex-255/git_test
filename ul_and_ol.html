<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unordered and ordered lists</title>
  </head>
  <body>
    <h2>To buy</h2>
    <ul>
      <li>milk</li>
      <li>bread</li>
    </ul>
    <h2>todo list</h2>
    <ol>
      <li>eat</li>
      <li>sleep</li>
      <li>learning TOP</li>
    </ol>
    <h2>Places</h2>
    <ul>
      <li>Greece</li>
      <li>Waterfalls somewhere</li>
    </ul>
    <h2>Games and Movies</h2>
    <ol>
      <li>The Matrix</li>
      <li>Titanic</li>
      <li>The fifth element</li>
    </ol>
  </body>
</html>
